<!DOCTYPE html>
<html>
<head>
    <title>Senior Registration | Senior–Junior Connect</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea, #764ba2);
            padding: 40px 15px;
        }

        .container {
            max-width: 700px;
            margin: auto;
            background: white;
            padding: 35px;
            border-radius: 18px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            color: #777;
            margin-bottom: 30px;
        }

        h2 {
            color: #667eea;
            margin-top: 25px;
            margin-bottom: 15px;
            font-size: 19px;
        }

        label {
            display: block;
            margin-top: 14px;
            margin-bottom: 6px;
            font-weight: bold;
            color: #444;
        }

        input,
        textarea,
        select {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 15px;
        }

        textarea {
            min-height: 80px;
            resize: vertical;
        }

        input:focus,
        textarea:focus,
        select:focus {
            outline: none;
            border-color: #667eea;
        }

        .checkbox-group {
            margin-top: 10px;
        }

        .checkbox-group label {
            font-weight: normal;
            display: inline-block;
            margin: 6px 15px 6px 0;
        }

        .checkbox-group input {
            width: auto;
            margin-right: 5px;
        }

        button {
            width: 100%;
            margin-top: 30px;
            padding: 14px;
            border: none;
            border-radius: 8px;
            background: #667eea;
            color: white;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #5568d9;
        }

        .login-link {
            text-align: center;
            margin-top: 20px;
        }

        .login-link a {
            color: #667eea;
            text-decoration: none;
            font-weight: bold;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Senior Registration</h1>

    <p class="subtitle">
        Share your experience and guide juniors.
    </p>

    <form action="/register" method="POST">

        <h2>👤 Personal Details</h2>

        <label>Full Name</label>
        <input type="text" name="name" required>

        <label>Department</label>
        <input type="text" name="department" placeholder="Example: CSE" required>

        <label>Year</label>
        <input type="text" name="year" placeholder="Example: 3rd Year" required>

        <label>Current Status</label>
        <select name="status" required>
            <option value="">-- Select --</option>
            <option value="Student">Student</option>
            <option value="Intern">Intern</option>
            <option value="Working Professional">Working Professional</option>
        </select>

        <label>Current Work / Role</label>
        <input type="text" name="current_work"
               placeholder="Example: Software Developer / Student">

        <label>City / District</label>
        <input type="text" name="location"
               placeholder="Example: Coimbatore">

        <h2>💻 Skills & Experience</h2>

        <label>Skills</label>
        <textarea name="skills"
                  placeholder="Example: Python, Java, DSA, AI/ML"
                  required></textarea>

        <label>Projects</label>
        <textarea name="projects"
                  placeholder="Describe your projects"></textarea>

        <label>Hackathon / Technical Experience</label>
        <textarea name="hackathon"
                  placeholder="Example: SIH, Hackathon projects, technical events"></textarea>

        <label>Internship Experience</label>
        <textarea name="internship"
                  placeholder="Describe your internship experience"></textarea>

        <h2>🤝 Areas You Can Guide</h2>

        <div class="checkbox-group">

            <label>
                <input type="checkbox" name="guidance" value="Hackathons">
                Hackathons
            </label>

            <label>
                <input type="checkbox" name="guidance" value="Projects">
                Projects
            </label>

            <label>
                <input type="checkbox" name="guidance" value="DSA">
                DSA
            </label>

            <label>
                <input type="checkbox" name="guidance" value="Placement">
                Placement
            </label>

            <label>
                <input type="checkbox" name="guidance" value="Coding">
                Coding
            </label>

            <label>
                <input type="checkbox" name="guidance" value="AI/ML">
                AI / ML
            </label>

            <label>
                <input type="checkbox" name="guidance" value="Web Development">
                Web Development
            </label>

        </div>

        <h2>📞 Guidance Preference</h2>

        <label>Preferred Guidance Mode</label>

        <select name="mode" required>
            <option value="">-- Select --</option>
            <option value="Online">Online</option>
            <option value="In Person">In Person</option>
            <option value="Both">Both</option>
        </select>

        <h2>🔐 Create Login</h2>

        <label>Username</label>
        <input type="text"
               name="username"
               placeholder="Create a username"
               required>

        <label>Password</label>
        <input type="password"
               name="password"
               placeholder="Create a password"
               required>

        <button type="submit">
            CREATE SENIOR ACCOUNT
        </button>

    </form>

    <div class="login-link">
        Already have an account?
        <a href="/login">Login</a>
    </div>

</div>

</body>
</html>
