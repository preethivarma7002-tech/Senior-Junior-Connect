<!DOCTYPE html>
<html>
<head>

    <title>Junior Home</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            margin: 0;
            padding: 30px;
        }

        .container {
            max-width: 700px;
            margin: auto;
            text-align: center;
        }

        h1 {
            color: #222;
        }

        .welcome {
            color: #555;
            margin-bottom: 25px;
        }

        .card {
            background: white;
            padding: 30px;
            border-radius: 12px;

            box-shadow:
                0 3px 10px rgba(0,0,0,0.08);
        }

        textarea {
            width: 90%;
            height: 120px;

            padding: 12px;

            border: 1px solid #ccc;
            border-radius: 8px;

            font-size: 16px;

            resize: none;
        }

        button {
            margin-top: 18px;

            padding: 12px 25px;

            border: none;
            border-radius: 7px;

            background: #2563eb;
            color: white;

            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        .links {
            margin-top: 25px;
        }

        .link-button {
            display: inline-block;

            margin: 5px;

            padding: 10px 18px;

            background: #16803c;

            color: white;

            text-decoration: none;

            border-radius: 7px;
        }

        .logout {
            display: inline-block;

            margin-top: 25px;

            color: #d00;

            text-decoration: none;
        }

    </style>

</head>

<body>

<div class="container">

    <h1>🎓 Senior–Junior Connect</h1>

    <div class="welcome">

        Welcome, <b>{{ name }}</b>!

    </div>


    <div class="card">

        <h2>How can we help you?</h2>

        <p>
            Describe your doubt or requirement.
            Our AI will find suitable seniors for you.
        </p>


        <form
            action="/matches"
            method="POST"
        >

            <textarea
                name="requirement"
                placeholder="Example: I want to participate in a hackathon. I need help choosing a project and understanding how to start."
                required
            ></textarea>

            <br>

            <button type="submit">
                🤖 Find Best Senior
            </button>

        </form>


        <div class="links">

            <a
                class="link-button"
                href="/my-requests"
            >
                📋 My Requests
            </a>

        </div>

    </div>


    <a
        class="logout"
        href="/logout"
    >
        Logout
    </a>

</div>

</body>
</html>
